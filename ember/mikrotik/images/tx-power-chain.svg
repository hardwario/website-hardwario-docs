<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" font-family="Inter, Arial, Helvetica, sans-serif">
<rect width="1000" height="270" rx="12" fill="#ffffff"/>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#ED1C24"/></marker></defs>
<rect x="26" y="30" width="205" height="130" rx="10" fill="#f6f6f8" stroke="#c9c9d3" stroke-width="2"/>
<text x="128.5" y="64" text-anchor="middle" font-size="20" font-weight="700" fill="#252532">Network Server</text>
<text x="128.5" y="96" text-anchor="middle" font-size="14" fill="#5b5b6b">server_value</text>
<text x="128.5" y="134" text-anchor="middle" font-size="22" font-weight="700" fill="#ED1C24">27 dBm EIRP</text>
<line x1="237" y1="95.0" x2="269" y2="95.0" stroke="#ED1C24" stroke-width="3" marker-end="url(#a)"/>
<rect x="277" y="30" width="205" height="130" rx="10" fill="#f6f6f8" stroke="#c9c9d3" stroke-width="2"/>
<text x="379.5" y="64" text-anchor="middle" font-size="20" font-weight="700" fill="#252532">EMBER radio</text>
<text x="379.5" y="96" text-anchor="middle" font-size="14" fill="#5b5b6b">subtracts antenna-gain 4.5</text>
<text x="379.5" y="134" text-anchor="middle" font-size="22" font-weight="700" fill="#252532">22.5 dBm out</text>
<line x1="488" y1="95.0" x2="520" y2="95.0" stroke="#ED1C24" stroke-width="3" marker-end="url(#a)"/>
<rect x="528" y="30" width="205" height="130" rx="10" fill="#f6f6f8" stroke="#c9c9d3" stroke-width="2"/>
<text x="630.5" y="64" text-anchor="middle" font-size="20" font-weight="700" fill="#252532">Cable</text>
<text x="630.5" y="96" text-anchor="middle" font-size="14" fill="#5b5b6b">loses 2 dB</text>
<text x="630.5" y="134" text-anchor="middle" font-size="22" font-weight="700" fill="#252532">20.5 dBm</text>
<line x1="739" y1="95.0" x2="771" y2="95.0" stroke="#ED1C24" stroke-width="3" marker-end="url(#a)"/>
<rect x="779" y="30" width="205" height="130" rx="10" fill="#f6f6f8" stroke="#ED1C24" stroke-width="3"/>
<text x="881.5" y="64" text-anchor="middle" font-size="20" font-weight="700" fill="#252532">Antenna</text>
<text x="881.5" y="96" text-anchor="middle" font-size="14" fill="#5b5b6b">adds its 6.5 dBi gain</text>
<text x="881.5" y="134" text-anchor="middle" font-size="22" font-weight="700" fill="#ED1C24">27 dBm EIRP</text>
<text x="984" y="188" text-anchor="end" font-size="15" fill="#5b5b6b">radiated = what the server asked for</text>
<text x="500.0" y="246" text-anchor="middle" font-size="18" fill="#252532" font-family="Roboto Mono, DejaVu Sans Mono, monospace">antenna-gain = antenna gain − cable loss = 6.5 − 2 = 4.5</text>
</svg>
